<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="pa-pipe-title pa-pipe-desc">
  <title id="pa-pipe-title">ProtocolArc validation and diff pipeline</title>
  <desc id="pa-pipe-desc">Envelopes and contracts flow through four stages: parse JSON or JSONL, validate fields and types, diff consecutive revisions, and render a matrix report. The diff stage classifies each revision change as compatible, forward, or breaking, shown in a small legend.</desc>

  <rect width="760" height="300" fill="#f5f3ec"/>
  <rect x="0" y="0" width="6" height="300" fill="#13233f"/>

  <text x="34" y="42" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="700" fill="#13233f">validation and diff pipeline</text>
  <text x="34" y="63" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5c6670">deterministic output, exit code carries the verdict</text>

  <!-- inputs -->
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">
    <rect x="40" y="96" width="110" height="34" rx="3" fill="#ffffff" stroke="#3a5a8c" stroke-width="1.3"/>
    <text x="95" y="117" fill="#13233f">envelopes .jsonl</text>
    <rect x="40" y="150" width="110" height="34" rx="3" fill="#ffffff" stroke="#3a5a8c" stroke-width="1.3"/>
    <text x="95" y="171" fill="#13233f">contracts .json</text>
  </g>

  <!-- stages -->
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="200" y="118" width="112" height="48" rx="4" fill="#13233f"/>
