<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="pa-pipe-title pa-pipe-desc">
  <title id="pa-pipe-title">ProtocolArc validation and diff pipeline</title>
  <desc id="pa-pipe-desc">Envelopes and contracts flow through four stages: parse JSON or JSONL, validate fields and types, diff consecutive revisions, and render a matrix report. The diff stage classifies each revision change as compatible, forward, or breaking, shown in a small legend.</desc>

  <rect width="760" height="300" fill="#f5f3ec"/>
  <rect x="0" y="0" width="6" height="300" fill="#13233f"/>

  <text x="34" y="42" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="700" fill="#13233f">validation and diff pipeline</text>
  <text x="34" y="63" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5c6670">deterministic output, exit code carries the verdict</text>

  <!-- inputs -->
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">
    <rect x="40" y="96" width="110" height="34" rx="3" fill="#ffffff" stroke="#3a5a8c" stroke-width="1.3"/>
    <text x="95" y="117" fill="#13233f">envelopes .jsonl</text>
    <rect x="40" y="150" width="110" height="34" rx="3" fill="#ffffff" stroke="#3a5a8c" stroke-width="1.3"/>
    <text x="95" y="171" fill="#13233f">contracts .json</text>
  </g>

  <!-- stages -->
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="200" y="118" width="112" height="48" rx="4" fill="#13233f"/>
    <text x="256" y="140" fill="#f5f3ec" font-size="14" font-weight="600">parse</text>
    <text x="256" y="158" fill="#8fb0ad" font-size="10">load and shape</text>

    <rect x="344" y="118" width="112" height="48" rx="4" fill="#13233f"/>
    <text x="400" y="140" fill="#f5f3ec" font-size="14" font-weight="600">validate</text>
    <text x="400" y="158" fill="#8fb0ad" font-size="10">fields, types, enum</text>

    <rect x="488" y="118" width="112" height="48" rx="4" fill="#13233f"/>
    <text x="544" y="140" fill="#f5f3ec" font-size="14" font-weight="600">diff</text>
    <text x="544" y="158" fill="#8fb0ad" font-size="10">classify change</text>

    <rect x="632" y="118" width="96" height="48" rx="4" fill="#2f6f6a"/>
    <text x="680" y="140" fill="#ffffff" font-size="14" font-weight="600">report</text>
    <text x="680" y="158" fill="#cfe0de" font-size="10">matrix</text>
  </g>

  <!-- connectors -->
  <g stroke="#3a5a8c" stroke-width="1.6" fill="none">
    <path d="M150,113 L200,135"/>
    <path d="M150,167 L200,150"/>
    <path d="M312,142 L344,142"/>
    <path d="M456,142 L488,142"/>
    <path d="M600,142 L632,142"/>
  </g>

  <!-- compatibility legend from diff.py -->
  <text x="34" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#13233f">diff verdict</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="12">
    <rect x="34" y="234" width="14" height="14" fill="#2f6f6a"/>
    <text x="56" y="245" fill="#13233f">compatible: new accepts everything the old did</text>
    <rect x="34" y="256" width="14" height="14" fill="#3a5a8c"/>
    <text x="56" y="267" fill="#13233f">forward: old consumers keep working, new fields optional</text>
    <rect x="34" y="278" width="14" height="14" fill="#c8792b"/>
    <text x="56" y="289" fill="#13233f">breaking: a change can reject previously valid envelopes</text>
  </g>
</svg>

# draft note 32
