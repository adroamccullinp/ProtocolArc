[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolarc"
version = "0.1.0"
description = "Contract lab for agent protocol envelopes - versioned MCP/A2A message contracts, validation, and compatibility diffs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ProtocolArc contributors" }]
keywords = ["mcp", "a2a", "agents", "contracts", "compatibility", "validation"]
